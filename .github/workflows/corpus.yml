# Corpus lint — машинная проверка инвариантов конвейера Planfaktor.
# CI корпуса: линт + selftest на каждый push/PR; окружение верификации —
# см. README (supported verification environment).
name: corpus-lint

on: [push, pull_request]

# Минимальные права джобы (lint/selftest только читают репозиторий).
permissions:
  contents: read

# Сверхнабегающие прогоны того же workflow на том же ref снимаются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # ubuntu-latest и macos-latest — движущиеся ссылки на актуальный
    # runner-образ GitHub; пин раннер-образа не вводим (осознанно —
    # матрица ловит BSD/GNU-расхождения тулчейна, канон окружения —
    # README, секция supported verification environment).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        # fetch-depth: 0 — полная git-история: C15 digest-verify строит
        # множества исторических состояний контрактов из git log (план
        # 261116_1321); shallow-клон по умолчанию роняет чек (инцидент
        # релизного прогона v0.1.0 — run 43933331254)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Corpus lint
        run: scripts/check_corpus.sh
      - name: Corpus lint selftest
        run: scripts/check_corpus.sh --selftest

  # Static-джоба (план 261115_2254): статический анализ поверхностей,
  # не покрытых lint-матрицей — shellcheck единственного исполняемого
  # артефакта репо, actionlint workflow-файлов, smoke-инстанцирование
  # плана из живого шаблона. Без ОС-матрицы (анализаторы платформо-
  # нейтральны); версии инструментов пиннены литералом тега upstream-
  # релиза — стабильность прогона от движущихся runner-образов важнее
  # предустановленных версий; third-party actions не используются.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # fetch-depth: 0 — полная git-история: selftest/smoke переносят .git
        # в seeded-копию (план 261116_1321, Solution п.4), shallow-.git
        # роняет baseline C15 (инцидент релизного прогона v0.1.0)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install shellcheck v0.11.0 (upstream release)
        run: |
          set -o pipefail
          curl -fsSL \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Install actionlint v1.7.12 (upstream release)
        # тарбол actionlint плоский: бинарник в корне архива, без каталога
        # actionlint_<v>_<os>_<arch>/ (в отличие от shellcheck) — фикс
        # первого прогона джобы 43817752014
        run: |
          set -o pipefail
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Shellcheck
        run: shellcheck scripts/check_corpus.sh
      - name: Actionlint
        run: actionlint
      - name: Corpus lint smoke
        run: scripts/check_corpus.sh --smoke
